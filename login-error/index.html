<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBAlpha — Login didn't complete</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #E6F1FB;
    color: #042C53;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* === TOP NAV (cloned from homepage-preview) === */
  .nav {
    position: sticky;
    top: 0;
    background: #E6F1FB;
    border-bottom: 0.5px solid #185FA5;
    padding: 14px 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 50;
  }
  .nav-logo { font-size: 18px; font-weight: 600; color: #042C53; letter-spacing: -0.3px; text-decoration: none; }

  /* === STATUS CONTENT === */
  .status {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px 24px 64px;
    max-width: 600px;
    margin: 0 auto;
  }
  .status h1 {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.8px;
    line-height: 1.15;
    margin: 0 0 24px;
    color: #042C53;
  }
  .status p { font-size: 17px; color: #1A4D7A; margin: 0 0 14px; max-width: 520px; }

  /* === NAVY PRIMARY BUTTON (cloned from homepage-preview .hero-cta) === */
  .cta-primary {
    display: inline-block;
    font-size: 15px;
    padding: 14px 32px;
    background: #042C53;
    color: #E6F1FB;
    border-radius: 9px;
    text-decoration: none;
    font-weight: 500;
    margin-top: 8px;
    transition: background 0.15s, transform 0.15s;
  }
  .cta-primary:hover { background: #0C447C; transform: translateY(-1px); }

  /* === FOOTER (cloned from homepage-preview .site-links) === */
  .site-links {
    background: #DFEBF7;
    padding: 14px 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 13px;
    color: #5F7B97;
    border-top: 0.5px solid rgba(24, 95, 165, 0.2);
    flex-wrap: wrap;
  }
  .site-links a { color: #5F7B97; text-decoration: none; transition: color 0.15s; }
  .site-links a:hover { color: #042C53; }

  @media (max-width: 768px) {
    .nav { padding: 12px 20px; }
    .status { padding: 40px 20px 48px; }
    .status h1 { font-size: 30px; }
    .status p { font-size: 16px; }
    .site-links { padding: 14px 20px; font-size: 12px; }
  }
</style>
</head>
<body>

  <!-- TOP NAV -->
  <nav class="nav">
    <a href="/" class="nav-logo">ORBAlpha</a>
  </nav>

  <!-- STATUS -->
  <main class="status">
    <h1>Login didn't complete</h1>
    <p>Something went wrong while signing you in.</p>
    <p>This can happen if the login window was closed or timed out.</p>
    <a href="/api/auth/login" class="cta-primary">Try again →</a>
  </main>

  <!-- FOOTER -->
  <footer class="site-links">
    <span>Still stuck? <a href="/contact/">Contact us</a></span>
  </footer>

</body>
</html>
