<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBAlpha — Sign In Error</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #E6F1FB;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #2C2C2A;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 24px;
        background: #E6F1FB;
      }
      .topbar-logo {
        font-size: 17px;
        font-weight: 500;
        color: #042C53;
        letter-spacing: -0.2px;
        text-decoration: none;
      }
      .topbar-r {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .op-btn {
        padding: 6px 14px;
        font-size: 13px;
        background: transparent;
        color: #042C53;
        border: 0.5px solid #042C53;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        text-decoration: none;
        display: inline-block;
      }
      .op-btn.op-primary {
        background: #042C53;
        color: #E6F1FB;
      }
      .op-btn:hover { opacity: 0.85; }
      .center {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 120px);
        padding: 24px;
      }
      .card {
        background: #042C53;
        color: #E6F1FB;
        border-radius: 12px;
        padding: 40px 36px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .card-title {
        font-size: 20px;
        font-weight: 600;
        color: #E6F1FB;
        margin: 0 0 12px;
        letter-spacing: -0.3px;
      }
      .card-body {
        font-size: 14px;
        line-height: 1.6;
        color: #B5D4F4;
        margin: 0 0 28px;
      }
      .btn-primary {
        display: inline-block;
        background: #378ADD;
        color: #E6F1FB;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 11px 28px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s;
        margin-bottom: 12px;
      }
      .btn-primary:hover { background: #185FA5; }
      .btn-secondary {
        display: block;
        font-size: 12px;
        color: #85B7EB;
        text-decoration: none;
        margin-top: 8px;
      }
      .btn-secondary:hover { color: #E6F1FB; }
      .site-links {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 11px;
        color: #5F7B97;
      }
      .site-links a { color: #5F7B97; text-decoration: none; }
      .site-links a:hover { color: #042C53; }
      .site-links .sep { color: #C5D9EC; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="topbar-logo" href="/">ORBAlpha</a>
      <div class="topbar-r">
        <a class="op-btn" href="/api/auth/login">Sign in</a>
        <a class="op-btn op-primary" href="https://whop.com/orbalpha">Get access</a>
      </div>
    </div>

    <div class="center">
      <div class="card">
        <h1 class="card-title">Something went wrong</h1>
        <p class="card-body">
          There was a problem signing you in. Please try again.
          If the problem continues, contact support.
        </p>
        <a class="btn-primary" href="/api/auth/login">Try again</a>
        <a class="btn-secondary" href="mailto:support@orbalpha.com">Contact support →</a>
      </div>
    </div>

    <footer class="site-links">
      <span>&copy; 2026 ORBAlpha</span>
      <span class="sep">&middot;</span>
      <a href="/legal/">Legal</a>
      <span class="sep">&middot;</span>
      <a href="/contact/">Contact</a>
    </footer>
  </body>
</html>
